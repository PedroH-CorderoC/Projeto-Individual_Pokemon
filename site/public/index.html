<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeDS</title>
    <link rel="stylesheet" href="./Css/home.css">
    <link rel="stylesheet" href="./Css/perfil.css">
    <link rel="stylesheet" href="./Css/login_cadastro.css">
    <link rel="stylesheet" href="./Css/quiz_pokemon.css">
    <link rel="stylesheet" href="./Css/dash.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="Console">

        <div class="Borda Borda-cima" id="BordaCima">
            <div class="moldura">
                <div class="Tela grande" id="TelaGrande"></div>
            </div>
        </div>

        <div class="Dobradica">
            <span></span> <span></span> <span class="camera"></span> <span></span> <span></span>
        </div>

        <div class="Borda Borda-baixo" id="BordaBaixa">
            <div class="Controles">
                <div class="Direcional">
                    <button class="Cima">&#9650;</button>
                    <button class="Esquerda">&#9664;</button>
                    <span></span>
                    <button class="Direita">&#9654;</button>
                    <button class="Baixo">&#9660;</button>
                </div>

                <div class="moldura moldura-baixo">
                    <div class="Tela pequena" id="TelaBaixa"></div>
                </div>

                <div class="Lado-Direito">
                    <div class="abxy">
                        <button onclick="responder('b')" class="Teclas TX">X</button>
                        <button onclick="responder('a')" class="Teclas TY">Y</button>
                        <button onclick="responder('c')" class="Teclas TA">A</button>
                        <button onclick="responder('d')" class="Teclas TB">B</button>
                    </div>

                    <div class="Select-Start">
                        <button onclick="Quiz()">SELECT</button>
                        <button onclick="Quiz()">START</button>
                    </div>
                </div>
            </div>

            <div class="Menu" id="Menu">
                <button onclick="Dash()" id="dash">Dash</button>
                <button onclick="Quiz()" id="quiz_pokemon">Quiz</button>
                <button onclick="Home()" id="home">Home</button>
                <button onclick="Jogos()" id="jogos">Jogos</button>
                <button onclick="Perfil()" id="perfil">Perfil</button>
                <button onclick="Login()" id="login">Login</button>
            </div>
        </div>
    </div>
</body>

</html>
<script>
    let Nome_Usuario = '';
    let Email_Usuario = '';
    let Curiosidade = '';
    VoceSabia()
    home.style.color = 'white'
    home.style.background = 'blue'
    home.style.boxShadow = 'none'
    TelaGrande.innerHTML = `<h1>Olá, Treinador!</h1> <br>
    <h3>Escolha uma opção na parte de baixo do DS</h3><br><br>
    <div class='Caixa-texto'> <h4>Você Sabia?</h4>
    <p>${Curiosidade}</p>`
    TelaBaixa.innerHTML = `<h4 class="Home-Pequeno">Vamos descobrir mais sobre esse mundo Pokemon</h4><br>`

    function Home() {
        VoceSabia()
        resetar()
        home.style.color = 'white'
        home.style.background = 'blue'
        home.style.boxShadow = 'none'
        TelaGrande.innerHTML = `<h1>Olá, Treinador!</h1> <br>
    <h3>Escolha uma opção na parte de baixo do DS</h3><br><br>
    <div class='Caixa-texto'> <h4>Você Sabia?</h4>
    <p>${Curiosidade}</p></div>`
        TelaBaixa.innerHTML = `<h4 class="Home-Pequeno">Vamos descobrir mais sobre esse mundo Pokemon</h4><br>`
    }

    function resetar() {
        dash.style.color = '#2a3849'
        dash.style.background = 'white'
        dash.style.boxShadow = '3px 4px 0px gray'

        quiz_pokemon.style.color = '#2a3849'
        quiz_pokemon.style.background = 'white'
        quiz_pokemon.style.boxShadow = '3px 4px 0px gray'

        home.style.color = '#2a3849'
        home.style.background = 'white'
        home.style.boxShadow = '3px 4px 0px gray'

        jogos.style.color = '#2a3849'
        jogos.style.background = 'white'
        jogos.style.boxShadow = '3px 4px 0px gray'

        perfil.style.color = '#2a3849'
        perfil.style.background = 'white'
        perfil.style.boxShadow = '3px 4px 0px gray'

        login.style.color = '#2a3849'
        login.style.background = 'white'
        login.style.boxShadow = '3px 4px 0px gray'
    }

    function VoceSabia() {
        let Num_Curio = (Math.random() * 10).toFixed(0);

        if (Num_Curio == 1) {
            Curiosidade = 'Durante o desenvolvimento de Pokémon Red e Green, Shigeki Morimoto adicionou Mew secretamente, depois que a equipe já havia encerrado a fase de depuração. Ele aproveitou aproximadamente 300 bytes que sobraram no cartucho. A ideia era que ninguém descobrisse sua existência!'
        } else if (Num_Curio == 2) {
            Curiosidade = 'MissingNo. não é um Pokémon oficial, mas um erro de programação de Red e Blue. Ao encontrá-lo por meio de uma sequência específica de ações, o jogador podia multiplicar o sexto item da mochila por 128. O encontro também podia causar problemas nos gráficos e no Hall da Fama.'
        } else if (Num_Curio == 3) {
            Curiosidade = 'Até a quinta geração, uma Azurill fêmea tinha a possibilidade de evoluir para um Marill macho. Isso acontecia porque as duas espécies possuíam proporções de gênero diferentes. O comportamento foi corrigido a partir da sexta geração.'
        } else if (Num_Curio == 4) {
            Curiosidade = 'As manchas no corpo de Spinda são determinadas por valores internos do jogo. Isso permite mais de 4 bilhões de combinações diferentes, fazendo com que praticamente cada Spinda tenha uma aparência única.'
        } else if (Num_Curio == 5) {
            Curiosidade = 'Em Pokémon Black & White, existe uma diferença curiosa entre as duas versões: enquanto Pokémon Black possui a Black City, uma cidade cheia de prédios e treinadores, Pokémon White apresenta a White Forest, uma floresta repleta de natureza e Pokémon selvagens. Mas o mais interessante é que esses locais possuem habitantes que podem desaparecer com o tempo caso você não interaja com eles! Além disso, é possível receber habitantes de outros jogadores, fazendo com que cada cidade ou floresta tenha uma população diferente.'
        } else if (Num_Curio == 6) {
            Curiosidade = 'Em 16 de dezembro de 1997, o episódio 38 do anime, conhecido como Dennō Senshi Porygon, apresentou uma sequência de flashes vermelhos e azuis extremamente rápidos. O efeito provocou sintomas como convulsões, tontura e náuseas em centenas de espectadores japoneses. O episódio nunca mais foi retransmitido e Porygon acabou ficando associado a um dos maiores acidentes da história da televisão japonesa.'
        } else if (Num_Curio == 7) {
            Curiosidade = 'Em 1997, a Nintendo apresentou uma demonstração de Pokémon Gold e Silver que revelava uma Johto muito diferente da versão lançada. Vários Pokémon tinham designs alternativos, alguns nunca chegaram aos jogos e até o mapa possuía cidades e estruturas que foram modificadas ou removidas. É como descobrir uma versão perdida da segunda geração!'
        } else if (Num_Curio == 8) {
            Curiosidade = 'A tabela de efetividade de Red e Blue tinha um erro: golpes Fantasma deveriam ser super efetivos contra Psíquicos, mas causavam nenhum dano. Isso ajudou a tornar o tipo Psíquico extremamente dominante na primeira geração.'
        } else if (Num_Curio == 9) {
            Curiosidade = 'Durante anos, jogadores acreditaram que Mew estava escondido embaixo de um caminhão próximo ao porto de Vermilion. A lenda era falsa, mas nos remakes FireRed e LeafGreen os desenvolvedores colocaram um item escondido naquele mesmo local: uma Lava Cookie. Foi uma referência à famosa lenda criada pelos próprios jogadores!'
        } else {
            Curiosidade = 'Manaphy possui uma característica reprodutiva única: ao cruzá-lo com um Ditto, é possível obter um ovo de Phione. O mais curioso é que Phione nunca evolui para Manaphy, mesmo sendo diretamente relacionado a ele. É um dos casos mais incomuns de reprodução em toda a franquia!'
        }
    }

    function AplicarCor(nomeCor) {
        BordaCima.style.background = nomeCor;
        BordaBaixa.style.background = nomeCor;
    }
</script>
<script src="./JS/dashboard.js"></script>
<script src="./JS/quiz_pokemon.js"></script>
<script src="./JS/Jogo.js"></script>
<script src="./JS/login_cadastro.js"></script>
<script src="./JS/perfil.js"></script>
